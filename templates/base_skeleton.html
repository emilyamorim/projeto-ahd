{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ampliando Horizontes Digitais{% endblock %}</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=17">

  <!-- Tabler Icons (ícones usados em todo o projeto) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  {% block extra_css %}{% endblock %}
</head>
<body>

  {% block body %}
  {% endblock %}

  <!-- JS global -->
  <script src="{% static 'js/main.js' %}?v=5"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
