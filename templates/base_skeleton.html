{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ampliando Horizontes Digitais{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Ampliando Horizontes Digitais — Projeto do IFRN Campus Canguaretama voltado ao protagonismo feminino na tecnologia, robótica e ciência.{% endblock %}">
  <meta name="theme-color" content="#981869">

  <!-- Favicons e ícone do app -->
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="48x48" href="{% static 'img/favicon-48x48.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon-192x192.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'site.webmanifest' %}">

  <!-- Open Graph / Compartilhamento -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Ampliando Horizontes Digitais">
  <meta property="og:title" content="{% block og_title %}Ampliando Horizontes Digitais{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Projeto do IFRN Campus Canguaretama voltado ao protagonismo feminino na tecnologia, robótica e ciência.{% endblock %}">
  <meta property="og:image" content="{% if request %}{{ request.scheme }}://{{ request.get_host }}{% endif %}{% static 'img/logo_simbolo.png' %}">
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Ampliando Horizontes Digitais",
    "alternateName": ["Projeto AHD", "Amplia Elas"],
    "url": "{% if request %}{{ request.scheme }}://{{ request.get_host }}/{% else %}/{% endif %}"
  }
  </script>

  <!-- CSS global -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=17">

  <!-- Tabler Icons (ícones usados em todo o projeto) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  {% block extra_css %}{% endblock %}
</head>
<body>

  {% block body %}
  {% endblock %}

  <!-- JS global -->
  <script src="{% static 'js/main.js' %}?v=5"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
