{% extends "aluna/base_aluna.html" %}

{% block nav_perfil %}active{% endblock %}

{% block dashboard_content %}
<!-- Cabeçalho -->
<div class="content-header">
  <h3>Dados pessoais</h3>
  <button type="button" class="btn-sm-outline" id="btnEditarPerfil"><i class="ti ti-edit"></i> Editar</button>
</div>

<!-- Upload de Foto de Perfil -->
<div class="profile-photo-upload">
  <label for="fotoUpload" class="photo-circle clickable-avatar">
    {% if request.user.foto_perfil %}
      <img src="{{ request.user.foto_perfil.url }}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
    {% else %}
      {{ request.user.first_name|first|upper }}{{ request.user.last_name|first|upper }}
    {% endif %}
    <div class="avatar-overlay"><i class="ti ti-camera" style="font-size:24px"></i></div>
  </label>
  <input type="file" id="fotoUpload" accept="image/png, image/jpeg" style="display:none;">
  <div class="photo-info">
    <h4>Foto de perfil</h4>
    <p>JPG ou PNG, máx. 2MB.<br>Aparece no seu perfil público.</p>
  </div>
  <button class="btn-sm-outline btn-upload">
    <i class="ti ti-upload"></i> Enviar foto
  </button>
</div>

<!-- Formulário de Dados Pessoais (Leitura) -->
<form class="dash-form">
  
  <div class="form-group">
    <label>Nome completo</label>
    <input type="text" value="{{ request.user.get_full_name }}" readonly>
  </div>
  
  <div class="form-row">
    <div class="form-group">
      <label>Data de nascimento</label>
      <input type="text" value="{% if perfil and perfil.data_nascimento %}{{ perfil.data_nascimento|date:'d/m/Y' }}{% endif %}" readonly>
    </div>
    <div class="form-group">
      <label>Cidade</label>
      <input type="text" value="{% if perfil %}{{ perfil.cidade }}{% endif %}" readonly>
    </div>
  </div>
  
  <div class="form-group">
    <label>Escola</label>
    <input type="text" value="{% if perfil %}{{ perfil.escola }}{% endif %}" readonly>
  </div>
  
  <div class="form-row">
    <div class="form-group">
      <label>Tipo de participação</label>
      <input type="text" value="{% if perfil %}{{ perfil.get_tipo_participacao_display }}{% endif %}" readonly>
      <div class="form-help">Definido pela coordenação</div>
    </div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" value="{{ request.user.email }}" readonly>
    </div>
  </div>

</form>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const btnEditar = document.getElementById('btnEditarPerfil');
    const formInputs = document.querySelectorAll('.dash-form input');
    let isEditing = false;
    
    btnEditar.addEventListener('click', function() {
      isEditing = !isEditing;
      
      if(isEditing) {
        // Entra no modo edição
        btnEditar.innerHTML = '<i class="ti ti-check"></i> Salvar';
        btnEditar.className = 'btn-sm-primary';
        
        formInputs.forEach(input => {
          // Não destrava campos que são restritos por regra de negócio
          if(input.value !== "Bolsista" && input.value !== "IFRN - Campus Canguaretama" && input.value !== "emily.amorim@gmail.com") {
             input.removeAttribute('readonly');
          }
        });
        
        // Foca no primeiro campo (Nome)
        formInputs[0].focus();
        
      } else {
        // Salva e trava
        btnEditar.innerHTML = '<i class="ti ti-edit"></i> Editar';
        btnEditar.className = 'btn-sm-outline';
        
        formInputs.forEach(input => {
           input.setAttribute('readonly', true);
        });
        
        // Simular feedback visual para a aluna
        alert('✨ Seus dados foram atualizados com sucesso!');
      }
    });
  });
</script>
{% endblock %}
